baseURL = 'https://go-graphalgo.github.io/'
locale  = 'en-us'
title   = 'go-graphalgo'
# No theme -- the layout is the go-* family template: one self-contained
# layouts/index.html, and the shared design (styles, theme toggle, fork ribbon,
# icons) imported as the Hugo module github.com/go-fleettools/landingkit,
# pinned in go.mod.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-graphalgo (planned, wave 3): the graph algorithms gonum lacks, in pure Go (CGO=0): matching, isomorphism, cut extraction, remaining centralities and a MATLAB-style graph facade over gonum/graph, validated against NetworkX."

# Every field below is rendered by layouts/index.html. A field nothing renders
# does not stay true. The organization is planned: no library has a repository.
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-graphalgo.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): the scope, the plan and one page per planned package, with its references. <a href=\"https://github.com/go-graphalgo/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-graphalgo/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

[[params.packages]]
  name  = "graph"
  wave  = 3
  href  = "https://go-graphalgo.github.io/docs/latest/graph/"
  blurb = "Graph algorithms that gonum/graph lacks, behind a MATLAB-style graph and digraph facade."

# The cards of #checks and their count come from this list. Each statement is
# a plan, from the roadmap's bibliography, not a result.
[[params.checks]]
  name = "Exact equality on integer problems"
  what = "Integer-weight shortest paths, flow values, matching sizes and component partitions equal NetworkX's. (planned)"
[[params.checks]]
  name = "Communities by modularity"
  what = "Louvain and Leiden are not deterministic: the seed is fixed and modularity is compared within a tolerance, not labels. (planned)"
[[params.checks]]
  name = "Public corpora"
  what = "SNAP graphs and the DIMACS implementation-challenge instances for flows, matching and shortest paths. (planned)"

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 8.60:1, bright on the dark background 7.47:1.
  base = "#3a3fa6"
  deep = "#232665"
  bright = "#8e9bf2"
  shadow = "rgba(58,63,166,.7)"
  glow = "rgba(58,63,166,.6)"
  wash = "rgba(58,63,166,.10)"
  washDeep = "rgba(35,38,101,.06)"
  chipBg = "#f1f3fd"
  chipBorder = "#dde1fb"
  chipFg = "#232665"
  chipBgDark = "rgba(142,155,242,.14)"
  chipBorderDark = "rgba(142,155,242,.32)"
  chipFgDark = "#c1c8f8"
  statsEnd = "#e4e7fc"
  bandText = "#edeffd"
